# The checks for every change: ESLint, and the browser suites (tests/e2e) with the accessibility audits
# (tests/a11y) split into 4 parts that run at the same time (run.js --shard, balanced with tests/durations.json).
# «Todo bien» passes only when all of them did: it is the project's Deployment Check in Vercel, so production
# waits for it. Renaming that job means changing it there too.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm run lint

  pruebas:
    name: Parte ${{ matrix.parte }} de 4
    # Not ubuntu-latest: since it became 26.04, the pinned Playwright (1.56.1) can't install Chromium there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node run.js --all --shard=${{ matrix.parte }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-${{ matrix.parte }}
          path: tests/shots/
          if-no-files-found: ignore

  # A job whose needs failed is skipped, and a skipped check counts as passed: hence always() and the test.
  todo-bien:
    name: Todo bien
    needs: [lint, pruebas]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "ESLint: ${{ needs.lint.result }} · pruebas: ${{ needs.pruebas.result }}"
          test "${{ needs.lint.result }}" = success && test "${{ needs.pruebas.result }}" = success

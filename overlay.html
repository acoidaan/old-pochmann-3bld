<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay · Old Pochmann 3BLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Martian+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Stream overlay for OBS (browser source, 1920x1080, transparent).
   The app sends its state through obs-websocket or a BroadcastChannel. */
:root {
  --panel: rgba(12, 15, 21, 0.86);
  --panel-line: rgba(255, 255, 255, 0.09);
  --ink: #EDF0F5;
  --muted: #9AA5B6;
  --faint: rgba(255, 255, 255, 0.10);
  --memo: #F0699C;
  --exec: #5B9BFF;
  --wait: #F0CF0C;
  --ok: #4CC774;
  --dnf: #E5484D;
  --plastic: #05070A;
  --st-U: #ECEEE8; --st-R: #D7263D; --st-F: #1E9E4B; --st-D: #F0CF0C; --st-L: #EE7A1A; --st-B: #2563D6;
  --learn: #4FD1C5;
  --fr-blank: #3A414E;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif;
  --font-mono: "Martian Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
body.chroma { background: #00FF00; }

.stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0;
  display: grid; padding: 40px; gap: 18px;
}
/* --k grows the cards for small viewers (Discord); the grid tracks grow with them. */
.stage { --k: 1; }
body.big .stage[data-layout=esquinas], body.big .stage[data-layout=crono] { --k: 1.18; }
.stage[data-layout=esquinas] {
  grid-template-columns: calc(480px * var(--k)) 1fr calc(560px * var(--k));
  grid-template-rows: auto 1fr auto;
  grid-template-areas: "brand . scr" ". . ." "stats . timer";
}
.stage[data-layout=derecha], .stage[data-layout=izquierda] {
  grid-template-rows: auto auto auto auto 1fr;
  align-content: start;
}
.stage[data-layout=derecha] { grid-template-columns: 1fr 520px; grid-template-areas: ". brand" ". timer" ". scr" ". stats" ". ."; }
.stage[data-layout=izquierda] { grid-template-columns: 520px 1fr; grid-template-areas: "brand ." "timer ." "scr ." "stats ." ". ."; }
.stage[data-layout=crono] {
  grid-template-columns: 1fr calc(640px * var(--k)) 1fr;
  grid-template-rows: 1fr auto;
  grid-template-areas: ". . ." ". timer .";
}
.stage[data-layout=crono] .brand, .stage[data-layout=crono] .scr, .stage[data-layout=crono] .stats { display: none; }

.card {
  background: var(--panel);
  border: 1.5px solid var(--panel-line);
  border-radius: 22px;
  padding: 22px 26px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  min-width: 0;
  transition: border-color .25s ease, box-shadow .25s ease;
}
.brand { grid-area: brand; align-self: start; }
.scr { grid-area: scr; align-self: start; }
.stats { grid-area: stats; align-self: end; }
.timer { grid-area: timer; align-self: end; position: relative; }
.stage[data-layout=derecha] .card, .stage[data-layout=izquierda] .card { align-self: start; }
.card { zoom: var(--k); }
.card[hidden], [hidden] { display: none !important; }

.eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.eyebrow .soft { letter-spacing: .04em; text-transform: none; font-weight: 400; }

/* Brand */
.brand-top { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
.logo { display: grid; grid-template-columns: repeat(3, 13px); gap: 3px; padding: 5px; background: var(--plastic); border-radius: 8px; flex: none; }
.logo i { width: 13px; height: 13px; border-radius: 3px; }
.who { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.method { font-size: 18px; color: var(--muted); margin-top: 3px; }
.live { width: 11px; height: 11px; border-radius: 50%; background: #5A6372; flex: none; }
.live.on { background: var(--memo); box-shadow: 0 0 0 0 rgba(240, 105, 156, .6); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240, 105, 156, .55); } 70% { box-shadow: 0 0 0 9px rgba(240, 105, 156, 0); } 100% { box-shadow: 0 0 0 0 rgba(240, 105, 156, 0); } }
.prog { display: grid; gap: 10px; margin-top: 18px; }
.prow { display: grid; gap: 5px; }
.prow-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; color: var(--muted); }
.prow-top b { color: var(--ink); font-family: var(--font-display); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--faint); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); transition: width .6s ease; }
.bar.learn i { background: var(--memo); }
.total { margin-top: 14px; font-size: 18px; color: var(--muted); }
.total b { color: var(--ink); }
.prow .s { display: none; }
body.no-prog .prog, body.no-prog .total { display: none; }
/* Side layouts stack everything in one column, so the cards are more compact. */
.stage[data-layout=derecha] .prog, .stage[data-layout=izquierda] .prog { grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 16px; }
.stage[data-layout=derecha] .prow .l, .stage[data-layout=izquierda] .prow .l { display: none; }
.stage[data-layout=derecha] .prow .s, .stage[data-layout=izquierda] .prow .s { display: inline; }
.stage[data-layout=derecha] .total, .stage[data-layout=izquierda] .total { display: none; }

/* Scramble */
.scr-text { margin: 12px 0 0; font-family: var(--font-mono); font-size: 25px; line-height: 1.55; word-spacing: .08em; }
.scr-text .mv { white-space: nowrap; }
.net { display: grid; grid-template-columns: repeat(4, auto); gap: 6px; justify-content: center; margin-top: 18px; --cell: 28px; }
.face { display: grid; grid-template-columns: repeat(3, var(--cell)); grid-template-rows: repeat(3, var(--cell)); gap: 3px; padding: 4px; background: var(--plastic); border-radius: 8px; }
.face i { border-radius: 4px; }
.c-U { background: var(--st-U); } .c-R { background: var(--st-R); } .c-F { background: var(--st-F); }
.c-D { background: var(--st-D); } .c-L { background: var(--st-L); } .c-B { background: var(--st-B); }
body.no-net .net { display: none; }
.stage[data-layout=derecha] .net, .stage[data-layout=izquierda] .net { --cell: 18px; margin-top: 14px; gap: 5px; }
.stage[data-layout=derecha] .face, .stage[data-layout=izquierda] .face { gap: 2px; padding: 3px; border-radius: 6px; }
.stage[data-layout=derecha] .face i, .stage[data-layout=izquierda] .face i { border-radius: 3px; }
.stage[data-layout=derecha] .scr-text, .stage[data-layout=izquierda] .scr-text { font-size: 21px; margin-top: 10px; }

/* Stats */
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin-top: 14px; }
.stat span { display: block; font-size: 16px; color: var(--muted); }
.stat b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b small { font-family: var(--font-body); font-size: 19px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
.chip { font-family: var(--font-mono); font-size: 17px; font-weight: 600; padding: 4px 10px; border-radius: 8px; border: 1.5px solid; }
.chip.ok { color: var(--ok); border-color: rgba(76, 199, 116, .55); }
.chip.dnf { color: #FF8A8D; border-color: rgba(229, 72, 77, .55); }
.foot { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--panel-line); font-size: 18px; color: var(--muted); }
.foot b { color: var(--ink); font-family: var(--font-display); font-size: 21px; }
.foot .streak { margin-left: auto; color: var(--ok); font-weight: 700; }
.empty { margin: 12px 0 0; font-size: 19px; color: var(--muted); }
.stage[data-layout=derecha] .sgrid, .stage[data-layout=izquierda] .sgrid { grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 10px; margin-top: 10px; }
.stage[data-layout=derecha] .stat span, .stage[data-layout=izquierda] .stat span { font-size: 15px; }
.stage[data-layout=derecha] .stat b, .stage[data-layout=izquierda] .stat b { font-size: 22px; }
.stage[data-layout=derecha] .stat b small, .stage[data-layout=izquierda] .stat b small { font-size: 15px; margin-left: 3px; }
.stage[data-layout=derecha] .card, .stage[data-layout=izquierda] .card { padding: 20px 24px; }
.stage[data-layout=derecha] .chips, .stage[data-layout=izquierda] .chips { display: none; }
.stage[data-layout=derecha] .foot, .stage[data-layout=izquierda] .foot { margin-top: 12px; padding-top: 10px; }

/* Timer */
.trow { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.pill {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 17px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  padding: 7px 16px; border-radius: 999px; background: var(--faint); color: var(--muted);
}
.pill svg { width: 21px; height: 21px; flex: none; }
.retotag { margin-left: auto; font-size: 18px; font-weight: 700; color: var(--memo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer { container-type: inline-size; }
/* Fixed-width slots keep the digits still while they tick; the size fits the card. */
.time {
  font-family: var(--font-display); font-weight: 700; line-height: 1; margin: 16px 0 8px; white-space: nowrap;
  font-size: min(var(--max-time, 118px), calc(100cqi / var(--ems, 5)));
}
.time span { display: inline-block; text-align: center; }
.time .d { width: .86em; }
.time .p { width: .36em; }
.time.dim { color: #5D6676; }
.splits { display: flex; gap: 26px; font-size: 20px; color: var(--muted); }
.splits b { color: var(--ink); font-family: var(--font-display); font-weight: 500; font-variant-numeric: tabular-nums; margin-left: 6px; }
/* Memo: shown while executing (if it was checked) and with the result */
.memoline { display: grid; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--panel-line); }
.mrow { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.mrow .ml { flex: none; width: 96px; font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mrow code { min-width: 0; font-family: var(--font-mono); font-weight: 600; font-size: 22px; line-height: 1.35; word-spacing: .12em; color: var(--ink); }
.mrow .par { flex: none; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--wait); }
/* Where height is tight, the memo (or the smart cube's turns) takes the place of the cube drawing while it shows. */
.stage[data-memo][data-layout=derecha] .net, .stage[data-memo][data-layout=izquierda] .net, body.big .stage[data-memo] .net { display: none; }
.stage[data-live][data-layout=derecha] .net, .stage[data-live][data-layout=izquierda] .net { display: none; }
.timer[data-tone=memo] { border-color: rgba(240, 105, 156, .7); }
.timer[data-tone=memo] .pill { background: var(--memo); color: #1B0811; }
.timer[data-tone=exec] { border-color: rgba(91, 155, 255, .75); }
.timer[data-tone=exec] .pill { background: var(--exec); color: #06122A; }
.timer[data-tone=wait] .pill { background: var(--wait); color: #1D1800; }
.timer[data-tone=ok] .pill { background: var(--ok); color: #03140A; }
.timer[data-tone=dnf] .pill { background: var(--dnf); color: #fff; }
.timer.flash-ok { animation: flashOk 1.4s ease-out; }
.timer.flash-dnf { animation: flashDnf 1.4s ease-out; }
@keyframes flashOk { from { box-shadow: 0 0 0 10px rgba(76, 199, 116, .55), 0 12px 40px rgba(0,0,0,.35); } to { box-shadow: 0 0 0 0 rgba(76, 199, 116, 0), 0 12px 40px rgba(0,0,0,.35); } }
@keyframes flashDnf { from { box-shadow: 0 0 0 10px rgba(229, 72, 77, .5), 0 12px 40px rgba(0,0,0,.35); } to { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0), 0 12px 40px rgba(0,0,0,.35); } }
.banner {
  position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%);
  white-space: nowrap; font-family: var(--font-display); font-weight: 700; font-size: 30px;
  padding: 12px 26px; border-radius: 999px; background: var(--ok); color: #03140A;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  animation: pop 9s ease forwards;
}
.banner.first { background: var(--memo); color: #1B0811; }
@keyframes pop {
  0% { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.9); }
  6% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.06); }
  10% { transform: translateX(-50%) scale(1); }
  88% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
}
.stage[data-layout=derecha] .time, .stage[data-layout=izquierda] .time { --max-time: 100px; margin: 12px 0 6px; }

/* Smart cube: scramble progress, live cube, the attempt's turns and letters */
.cubetag { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: .1em; color: var(--ok); }
.cubetag i { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.scr-text .mv { transition: opacity .2s ease; }
.scr-text .mv.done { opacity: .3; }
.scr-text .mv.next { color: #1B0811; background: var(--memo); border-radius: 6px; padding: 0 4px; }
.scr-text .mv.half { color: var(--memo); background: transparent; box-shadow: inset 0 0 0 2px var(--memo); }
.scrhint { margin: 10px 0 0; font-size: 20px; font-weight: 700; color: var(--muted); }
.scrhint.ok { color: var(--ok); }
.scrhint.bad { color: #FF8A8D; }
.scrhint b { font-family: var(--font-mono); }
.liveline { display: grid; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--panel-line); }
.lmoves {
  justify-self: start; display: inline-flex; justify-content: flex-end; align-items: baseline; gap: .5em; max-width: 100%;
  overflow: hidden; white-space: nowrap; font-family: var(--font-mono); font-size: 21px; color: var(--muted);
}
.lmoves > * { flex: none; }
.lmoves .n { font-family: var(--font-body); font-size: 16px; }
.lmoves b { color: var(--exec); }
.lnote { font-size: 19px; line-height: 1.35; }
.lnote.ok { font-size: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ok); }
.lnote.dnf { color: #FF8A8D; }
.stage[data-layout=derecha] .lmoves, .stage[data-layout=izquierda] .lmoves { font-size: 18px; }

/* «Fridrich reducido»: the four steps instead of memo and execution, and the case being done */
.splits.cf { gap: 22px; }
.splits.cf span { transition: color .2s ease; }
.splits.cf .cur { color: var(--ink); }
.splits.cf .cur b { color: var(--exec); }
/* Against the reference: ahead, behind, the best ever for that part. */
.splits.cf span { display: inline-grid; grid-template-columns: auto auto; align-items: baseline; }
.splits.cf .pd { grid-column: 1 / -1; font-style: normal; font-weight: 700; font-size: 16px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.splits.cf .pd:empty { display: none; }
.splits.cf .pd.ahead { color: var(--ok); }
.splits.cf .pd.behind { color: var(--dnf); }
.splits.cf .pd.gold { color: var(--wait); }
.banner.pb { background: var(--wait); color: #1D1800; }
.confetti { position: absolute; left: 0; right: 0; bottom: 100%; height: 520px; pointer-events: none; overflow: visible; }
.confetti i { position: absolute; bottom: 0; width: 12px; height: 17px; border-radius: 2px; opacity: 0; animation: burst 2.6s cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes burst {
  0% { opacity: 1; transform: translate(0, 0) rotate(0); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); }
}
.casename { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.15; }
.lalg { font-family: var(--font-mono); font-size: 21px; color: var(--muted); word-spacing: .1em; }
.lalg b { color: var(--ink); font-weight: 600; }

/* Learning (Casos, Entrenar in the app): its own colour, the case instead of the scramble, the session. */
.stage[data-learn] .card { border-color: rgba(79, 209, 197, .38); }
.stage[data-learn] .live.on { background: var(--learn); animation: none; }
.timer[data-tone=learn] { border-color: rgba(79, 209, 197, .8); }
.timer[data-tone=learn] .pill { background: var(--learn); color: #062320; }
.timer[data-tone=learnok] { border-color: rgba(76, 199, 116, .8); }
.timer[data-tone=learnok] .pill { background: var(--ok); color: #03140A; }
.timer[data-tone=learnko] { border-color: rgba(229, 72, 77, .7); }
.timer[data-tone=learnko] .pill { background: var(--dnf); color: #fff; }
.learnpic { display: flex; align-items: center; gap: 22px; margin-top: 14px; }
.learnpic svg { width: 230px; height: auto; flex: none; }
.learnpic .fr-arrow path { stroke: var(--plastic); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.learnpic .lp-name { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.15; }
.learnpic .lp-sub { font-size: 18px; color: var(--muted); margin-top: 6px; }
.learnline { font-size: 22px; color: var(--muted); }
.learnline b { color: var(--ink); }
.learnline .ok { color: var(--ok); }
.learnline .ko { color: var(--dnf); }
.setrows { display: grid; gap: 8px; margin-top: 14px; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 20px; color: var(--muted); }
.setrow b { color: var(--ink); font-weight: 700; }
.setrow.cur b { color: var(--learn); }
.setrow .pips { letter-spacing: .18em; color: var(--learn); font-size: 18px; }
.setrows.many { grid-template-columns: 1fr 1fr; gap: 6px 18px; margin-top: 10px; }
.setrows.many .setrow { font-size: 15px; gap: 6px; min-width: 0; }
.setrows.many .setrow b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.setrows.many .setrow .pips { font-size: 13px; letter-spacing: .1em; flex: none; }
.donechips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.donechips span { font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: rgba(79, 209, 197, .16); color: var(--learn); }
.banner.won { background: var(--learn); color: #062320; }
.stage[data-learn] .scr-text .mv.next { color: #062320; background: var(--learn); }
.stage[data-learn] .scr-text .mv.half { color: var(--learn); background: transparent; box-shadow: inset 0 0 0 2px var(--learn); }

/* Waiting hint, only until the app has sent something once */
.wait {
  position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
  max-width: 900px; text-align: center; font-size: 22px; line-height: 1.4;
  background: var(--panel); border: 1.5px dashed rgba(240, 105, 156, .6); border-radius: 18px; padding: 16px 26px;
}
.wait b { color: var(--memo); }
@media (prefers-reduced-motion: reduce) { .live.on, .timer.flash-ok, .timer.flash-dnf { animation: none; } .banner { animation-duration: .01s; animation-iteration-count: 1; opacity: 1; } }
</style>
</head>
<body>
<div class="stage" id="stage" data-layout="esquinas">
  <section class="card brand" id="brand">
    <div class="eyebrow"><i class="live" id="live"></i><span id="brandTag">Aprendiendo 3BLD</span></div>
    <div class="brand-top">
      <div class="logo" aria-hidden="true">
        <i class="c-U"></i><i class="c-R"></i><i class="c-F"></i><i class="c-L"></i><i class="c-B"></i><i class="c-D"></i><i class="c-F"></i><i class="c-U"></i><i class="c-R"></i>
      </div>
      <div style="min-width:0">
        <div class="who" id="who">Old Pochmann</div>
        <div class="method" id="method">Letras Speffz · blanco arriba, verde delante</div>
      </div>
    </div>
    <div class="prog" id="prog"></div>
    <div class="total" id="total" hidden></div>
  </section>

  <section class="card scr" id="scrCard" hidden>
    <div class="eyebrow"><span id="scrLabel">Scramble</span> <span class="soft" id="moves"></span><span class="cubetag" id="cubeTag" hidden><i></i>Cubo en directo</span></div>
    <p class="scr-text" id="scrText"></p>
    <p class="scrhint" id="scrHint" hidden></p>
    <div class="learnpic" id="learnPic" hidden></div>
    <div class="net" id="net" aria-hidden="true"></div>
  </section>

  <section class="card stats" id="statsCard" hidden>
    <div class="eyebrow" id="statsLabel">Hoy</div>
    <div id="statsBody"></div>
  </section>

  <section class="card timer" id="timerCard" data-tone="idle" hidden>
    <div class="trow"><span class="pill" id="phase"></span><span class="retotag" id="retoTag"></span></div>
    <div class="time" id="time"></div>
    <div class="splits" id="bldSplits"><span>Memo<b id="sMemo">—</b></span><span>Ejecución<b id="sExec">—</b></span></div>
    <div class="splits cf" id="cfSplits" hidden><span>Cruz<b>—</b><i class="pd"></i></span><span>F2L<b>—</b><i class="pd"></i></span><span>OLL<b>—</b><i class="pd"></i></span><span>PLL<b>—</b><i class="pd"></i></span></div>
    <div class="memoline" id="memoLine" hidden></div>
    <div class="liveline" id="liveLine" hidden></div>
  </section>

  <div class="wait" id="wait" hidden>Esperando a la app… Ábrela y en <b>Ajustes → Overlay para stream</b> pulsa <b>Conectar con OBS</b>.</div>
</div>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const LAYOUTS = ['esquinas', 'derecha', 'izquierda', 'crono'];
  stage.dataset.layout = LAYOUTS.includes(q.get('layout')) ? q.get('layout') : 'esquinas';
  document.body.classList.toggle('big', q.get('size') === 'grande');
  document.body.classList.toggle('no-net', q.get('net') === '0');
  document.body.classList.toggle('no-prog', q.get('prog') === '0');
  document.body.classList.toggle('chroma', q.get('bg') === 'chroma');
  // Puts the first of `options` (the body of a card, from the fullest to the most compact) that keeps the card
  // on screen.
  function fitSet(card, options) {
    const sb = $('statsBody');
    const k = options[0] + '|' + innerWidth + 'x' + innerHeight;
    const fits = () => {
      const r = card.getBoundingClientRect();
      return r.bottom <= innerHeight - 8 && r.top >= 8;
    };
    // Cards above it can still grow (a picture drawn later), so a kept choice is checked again each time,
    // and when any card changes size.
    fitSet.last = [card, options];
    if (sb.dataset.fk === k && (fits() || sb.dataset.h === options[options.length - 1])) return;
    sb.dataset.fk = k;
    for (const html of options) {
      if (sb.dataset.h !== html) { sb.innerHTML = html; sb.dataset.h = html; }
      if (!card.getBoundingClientRect().height) { delete sb.dataset.fk; return; } // not laid out yet
      if (fits()) return;
    }
  }
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => { if (fitSet.last && !$('statsCard').hidden && stage.dataset.learn != null) fitSet(...fitSet.last); });
    document.querySelectorAll('.card').forEach((c) => ro.observe(c));
  }
  const DEMO = q.get('demo') === '1';
  const SHOW_MEMO = q.get('memo') !== '0';
  const CACHE_KEY = 'op3bld:overlay:last';

  // The design is laid out at 1920x1080 and scaled to whatever size the source has.
  function fit() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080) || 1;
    stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
  }
  addEventListener('resize', fit);
  fit();

  function fmt(ms) {
    if (ms == null || !isFinite(ms) || ms < 0) return '—';
    const cs = Math.floor(ms / 10);
    const m = Math.floor(cs / 6000);
    const s = Math.floor((cs % 6000) / 100);
    return `${m}:${String(s).padStart(2, '0')}.${String(cs % 100).padStart(2, '0')}`;
  }
  // Speedcubing times: 12.34, or 1:02.34 from a minute up.
  function fmtC(ms) {
    if (ms == null || !isFinite(ms) || ms < 0) return '—';
    const cs = Math.floor(ms / 10);
    const m = Math.floor(cs / 6000);
    const s = Math.floor((cs % 6000) / 100);
    return m ? `${m}:${String(s).padStart(2, '0')}.${String(cs % 100).padStart(2, '0')}` : `${s}.${String(cs % 100).padStart(2, '0')}`;
  }
  const text = (el, t) => { if (el.textContent !== t) el.textContent = t; };
  function setTime(t, dim) {
    const el = $('time');
    el.classList.toggle('dim', !!dim);
    if (el.dataset.t === t) return;
    el.dataset.t = t;
    el.textContent = '';
    el.style.setProperty('--ems', [...t].reduce((a, ch) => a + (/[\d?✓✗]/.test(ch) ? 0.86 : ch === '—' ? 1.2 : 0.36), 0).toFixed(2));
    for (const ch of t) {
      const s = document.createElement('span');
      s.className = /[\d?✓✗]/.test(ch) ? 'd' : 'p';
      s.textContent = ch;
      el.appendChild(s);
    }
  }

  // Cube net: six 3x3 faces in the usual cross layout.
  const NET = { U: [1, 2], L: [2, 1], F: [2, 2], R: [2, 3], B: [2, 4], D: [3, 2] };
  const ORDER = ['U', 'L', 'F', 'R', 'B', 'D'];
  const cells = [];
  ORDER.forEach((f) => {
    const face = document.createElement('div');
    face.className = 'face';
    face.style.gridRow = NET[f][0];
    face.style.gridColumn = NET[f][1];
    for (let i = 0; i < 9; i++) { const c = document.createElement('i'); face.appendChild(c); cells.push(c); }
    $('net').appendChild(face);
  });
  function paintNet(cube) {
    const ok = typeof cube === 'string' && cube.length === 54;
    $('net').hidden = !ok;
    if (!ok) return;
    for (let i = 0; i < 54; i++) cells[i].className = 'c-' + cube[i];
  }

  const ICON = {
    memo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
    exec: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c2.4 3 5.4 4.5 9 4.5s6.6-1.5 9-4.5M7 13.3 5.5 16M12 14.5V17.5M17 13.3l1.5 2.7"/></svg>',
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    dnf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  };
  function setPill(tone, label) {
    const card = $('timerCard');
    const pill = $('phase');
    const key = tone + '|' + label;
    if (pill.dataset.k === key) return;
    pill.dataset.k = key;
    card.dataset.tone = tone;
    pill.innerHTML = ICON[tone] || '';
    pill.appendChild(document.createTextNode(label));
  }

  let S = null;          // last state received
  let liveAt = 0;        // when the last live message arrived
  let lastSeen = null;   // last result we already celebrated
  let cancelUntil = 0;

  function renderStatic() {
    const s = S;
    $('wait').hidden = !!s;
    if (!s) return;
    const cf = s.mode === 'cfop';
    text($('brandTag'), cf ? 'Speedcubing · CFOP' : 'Aprendiendo 3BLD');
    text($('who'), s.name || (cf ? 'Fridrich reducido' : 'Old Pochmann'));
    text($('method'), cf ? 'CFOP en 2 pasos · algoritmos de J Perm' : s.name ? 'Old Pochmann · letras Speffz' : 'Letras Speffz · blanco arriba, verde delante');
    $('bldSplits').hidden = cf;
    $('cfSplits').hidden = !cf;

    // Learning progress
    const rows = [];
    if (cf && s.learned) {
      rows.push(['OLL que me sé', 'OLL', s.learned.oll[0], s.learned.oll[1], 'learn']);
      rows.push(['PLL que me sé', 'PLL', s.learned.pll[0], s.learned.pll[1], '']);
    }
    if (s.learn && s.learn.total) rows.push(['Tutorial', 'Tutorial', s.learn.done, s.learn.total, 'learn']);
    if (s.train) {
      rows.push(['Setups de aristas', 'Aristas', s.train.edge[0], s.train.edge[1], '']);
      rows.push(['Setups de esquinas', 'Esquinas', s.train.corner[0], s.train.corner[1], '']);
    }
    const prog = $('prog');
    const html = rows.map(([label, short, a, b, cls]) => `<div class=prow><div class=prow-top><span><span class=l>${label}</span><span class=s>${short}</span></span><b>${a}/${b}</b></div>`
      + `<div class='bar ${cls}'><i style='width:${b ? Math.round((100 * a) / b) : 0}%'></i></div></div>`).join('');
    if (prog.dataset.h !== html) { prog.dataset.h = html; prog.innerHTML = html; }
    const tot = $('total');
    tot.hidden = !(s.total && s.total.n);
    if (s.total && s.total.n) {
      tot.innerHTML = cf
        ? `<b>${s.total.n}</b> ${s.total.n === 1 ? 'solve' : 'solves'} en total`
        : `<b>${s.total.n}</b> ${s.total.n === 1 ? 'intento' : 'intentos'} · <b>${s.total.ok}</b> ${s.total.ok === 1 ? 'resuelto' : 'resueltos'} en total`;
    }

    const L = cf && s.learn ? s.learn : null;
    stage.toggleAttribute('data-learn', !!L);
    if (L) { renderLearn(s, L); return; }
    text($('scrLabel'), 'Scramble');
    text($('statsLabel'), 'Hoy');
    $('learnPic').hidden = true;
    $('scrText').hidden = false;
    $('net').hidden = false;

    // Scramble and its cube
    const card = $('scrCard');
    card.hidden = !s.scr;
    if (s.scr) {
      const sc = $('scrText');
      if (sc.dataset.s !== s.scr) {
        sc.dataset.s = s.scr;
        sc.textContent = '';
        s.scr.split(/\s+/).forEach((m, i) => {
          if (i) sc.appendChild(document.createTextNode(' '));
          const span = document.createElement('span');
          span.className = 'mv';
          span.textContent = m;
          sc.appendChild(span);
        });
      }
      text($('moves'), s.moves > 0 ? `· ${s.moves} movimientos` : '');
      // A connected smart cube: the drawing is the real cube, and the scramble shows how far it is.
      const sm = s.smart && s.smart.net ? s.smart : null;
      $('cubeTag').hidden = !sm;
      paintNet(sm ? sm.net : s.cube);
      const idle = !s.timer || s.timer.phase === 'idle';
      const f = sm && idle && sm.scr ? sm.scr : null;
      [...sc.children].forEach((el, k) => {
        const on = f && !f.lost;
        el.classList.toggle('done', !!on && k < f.done);
        el.classList.toggle('next', !!on && !f.undo && k === f.done);
        el.classList.toggle('half', !!on && !f.undo && k === f.done && f.half);
      });
      let hint = '';
      let tone = '';
      if (f) {
        if (f.lost) { hint = 'Resolviendo el cubo para mezclarlo…'; }
        else if (f.undo) { hint = `Deshaciendo un giro: <b>${f.undo}</b>`; tone = 'bad'; }
        else if (f.done >= f.n) { hint = '✓ Cubo mezclado'; tone = 'ok'; }
      }
      const sh = $('scrHint');
      sh.hidden = !hint;
      sh.className = `scrhint ${tone}`;
      if (sh.dataset.h !== hint) { sh.dataset.h = hint; sh.innerHTML = hint; }
    }

    // Today's numbers
    const st = $('statsCard');
    st.hidden = false;
    const t = s.today || { n: 0 };
    let body = '';
    if (cf && t.n) {
      body += '<div class=sgrid>'
        + `<div class=stat><span>Solves</span><b>${t.n}</b></div>`
        + `<div class=stat><span>Mejor</span><b>${fmtC(t.best)}</b></div>`
        + `<div class=stat><span>ao5</span><b>${t.ao5 == null ? '—' : t.ao5 < 0 ? 'DNF' : fmtC(t.ao5)}</b></div>`
        + `<div class=stat><span>ao12</span><b>${t.ao12 == null ? '—' : t.ao12 < 0 ? 'DNF' : fmtC(t.ao12)}</b></div>`
        + '</div>';
      if (s.recent && s.recent.length) body += '<div class=chips>' + s.recent.map((r) => `<span class='chip ${r.ok ? 'ok' : 'dnf'}'>${r.ok ? fmtC(r.t) : 'DNF'}</span>`).join('') + '</div>';
    } else if (t.n) {
      body += '<div class=sgrid>'
        + `<div class=stat><span>Intentos</span><b>${t.n}</b></div>`
        + `<div class=stat><span>Resueltos</span><b>${t.ok}<small>${Math.round((100 * t.ok) / t.n)} %</small></b></div>`
        + `<div class=stat><span>Mejor</span><b>${fmt(t.best)}</b></div>`
        + `<div class=stat><span>Media</span><b>${fmt(t.mean)}</b></div>`
        + '</div>';
      if (s.recent && s.recent.length) {
        body += '<div class=chips>' + s.recent.map((r) => `<span class='chip ${r.ok ? 'ok' : 'dnf'}'>${r.ok ? fmt(r.t) : 'DNF'}</span>`).join('') + '</div>';
      }
    } else {
      body += `<p class=empty>Todavía no hay ${cf ? 'solves' : 'intentos'} hoy.</p>`;
    }
    if (s.record != null || (t.streak || 0) >= 2) {
      body += '<div class=foot>' + (s.record != null ? `<span>Récord</span><b>${cf ? fmtC(s.record) : fmt(s.record)}</b>` : '')
        + ((t.streak || 0) >= 2 ? `<span class=streak>Racha de ${t.streak}</span>` : '') + '</div>';
    }
    const sb = $('statsBody');
    if (sb.dataset.h !== body) { sb.dataset.h = body; sb.innerHTML = body; delete sb.dataset.fk; }

    // Timer card (the clock itself is painted every frame)
    $('timerCard').hidden = false;
    text($('retoTag'), s.reto ? `Reto de ${s.reto}` : '');
  }

  // ---- Learning: the case, how it went, the session
  const LEARN_MODE = { cube: 'con el cubo inteligente', hand: 'con su cubo', look: 'reconociendo' };
  function renderLearn(s, L) {
    text($('brandTag'), 'Aprendiendo · CFOP');
    text($('method'), L.view === 'casos' ? 'Repasando los casos · algoritmos de J Perm' : `Entrenando OLL y PLL ${LEARN_MODE[L.tmode] || ''}`);
    // The case card: the setup moves on the live cube, or the case itself once it is not a guess.
    const card = $('scrCard');
    const sm = s.smart && s.smart.net ? s.smart : null;
    const pic = $('learnPic');
    const sc = $('scrText');
    let label = '';
    let showPic = false;
    let showNet = false;
    let showText = false;
    let hint = '';
    let tone = '';
    if (L.phase === 'setup' && L.setup) {
      label = 'Preparando el caso';
      showText = true;
      showNet = !!sm;
      const key = L.setup.moves.join(' ');
      if (sc.dataset.s !== key) {
        sc.dataset.s = key;
        sc.innerHTML = L.setup.moves.map((m) => `<span class=mv>${esc(m)}</span>`).join(' ');
      }
      [...sc.children].forEach((el, k) => {
        el.classList.toggle('done', !L.setup.lost && k < L.setup.pos);
        el.classList.toggle('next', !L.setup.lost && k === L.setup.pos);
        el.classList.toggle('half', !L.setup.lost && k === L.setup.pos && L.setup.half);
      });
      if (L.setup.lost) { hint = 'Se ha perdido: empezando desde como está'; tone = 'bad'; }
    } else if (L.phase === 'solving') {
      label = `${L.step || 'Caso'} · resolviendo`;
      showNet = !!sm;
    } else if (L.pic && (L.phase === 'question' || L.phase === 'answered' || L.phase === 'result')) {
      label = L.phase === 'question' ? `${L.step || 'Caso'} · ¿qué caso es?` : 'El caso';
      showPic = true;
      const name = L.phase === 'question' ? '' : `<div><div class=lp-name>${esc(L.cname || '')}</div><div class=lp-sub>${esc(L.step || '')}</div></div>`;
      const html = L.pic + name;
      if (pic.dataset.h !== html) { pic.dataset.h = html; pic.innerHTML = html; }
    } else if (L.phase === 'question') {
      label = `${L.step || 'Caso'} · mezclando su cubo`;
    }
    card.hidden = !label;
    text($('scrLabel'), label);
    text($('moves'), '');
    $('cubeTag').hidden = !showNet;
    sc.hidden = !showText;
    pic.hidden = !showPic;
    $('net').hidden = !showNet;
    if (showNet) paintNet(sm.net);
    const sh = $('scrHint');
    sh.hidden = !hint;
    sh.className = `scrhint ${tone}`;
    if (sh.dataset.h !== hint) { sh.dataset.h = hint; sh.innerHTML = hint; }

    // The session (or this week's training)
    const st = $('statsCard');
    st.hidden = false;
    const S2 = L.session;
    let body = '';
    if (S2) {
      text($('statsLabel'), 'Sesión de entrenamiento');
      body += '<div class=sgrid>'
        + `<div class=stat><span>Tiempo</span><b id=lsClock>—</b></div>`
        + `<div class=stat><span>Casos</span><b>${S2.n}</b></div>`
        + `<div class=stat><span>Bien</span><b>${S2.n ? Math.round((100 * S2.ok) / S2.n) : 0}<small>%</small></b></div>`
        + `<div class=stat><span>Dominados</span><b>${S2.done.length}</b></div>`
        + '</div>';
      // The set of cases, made to fit on screen: one column for a few cases, two for more, and as many rows
      // as fit (the one being done always among them, "+N más" for the rest); at most 4 mastered ones.
      const setHtml = (max, two) => {
        let rows = S2.set;
        if (rows.length > max) {
          const cur = rows.findIndex((x) => x.cur);
          rows = rows.slice(0, max);
          if (cur >= max && max) rows[max - 1] = S2.set[cur];
        }
        const more = S2.set.length - rows.length;
        return `<div class='setrows${two ? ' many' : ''}'>` + rows.map((x) => `<div class='setrow${x.cur ? ' cur' : ''}'><b>${esc(x.name)}</b><span class=pips>${'●'.repeat(x.k)}${'○'.repeat(S2.need - x.k)}</span></div>`).join('')
          + (more ? `<div class=setrow><span>+${more} más</span></div>` : '') + '</div>';
      };
      const tail = S2.done.length ? '<div class=donechips>' + S2.done.slice(-4).map((n) => `<span>✓ ${esc(n)}</span>`).join('') + (S2.done.length > 4 ? `<span>+${S2.done.length - 4}</span>` : '') + '</div>' : '';
      const tries = [];
      if (S2.set.length <= 5) tries.push([S2.set.length, false]);
      for (const m of [11, 9, 7, 5, 3, 1]) if (m < S2.set.length || !tries.length) tries.push([Math.min(m, S2.set.length), true]);
      tries.push([0, true]);
      fitSet(st, tries.map(([m, two]) => body + setHtml(m, two) + tail));
      body = null;
    } else {
      text($('statsLabel'), 'Entrenando · esta semana');
      const w = L.week || {};
      body += '<div class=sgrid>'
        + `<div class=stat><span>Casos</span><b>${w.reps || 0}</b></div>`
        + `<div class=stat><span>Días</span><b>${w.days || 0}</b></div>`
        + `<div class=stat><span>Reconocer</span><b>${w.quiz == null ? '—' : `${w.quiz}<small>%</small>`}</b></div>`
        + `<div class=stat><span>Con el cubo</span><b>${w.cube == null ? '—' : fmtC(w.cube)}</b></div>`
        + '</div>';
    }
    if (body != null) {
      const sb = $('statsBody');
      if (sb.dataset.h !== body) { sb.dataset.h = body; sb.innerHTML = body; delete sb.dataset.fk; }
    }
    $('timerCard').hidden = false;
    text($('retoTag'), '');
  }
  // Every frame: the pill, the clock and the line under it.
  function paintLearn() {
    const L = S.learn;
    const now = Date.now();
    $('bldSplits').hidden = true;
    $('cfSplits').hidden = true;
    setMemo(null);
    let line = '';
    if (L.phase === 'setup') {
      setPill('learn', 'Preparando el caso');
      setTime('—', true);
      line = `<b>${esc(L.step || '')}</b> · dejándolo en el caso`;
    } else if (L.phase === 'solving') {
      setPill('learn', '¡Ya! Resolviendo');
      setTime(fmtC(now - L.t0));
      line = `<b>${esc(L.step || '')}</b> · ¿qué caso es?`;
    } else if (L.phase === 'question') {
      setPill('learn', '¿Qué caso es?');
      if (L.t0) setTime(fmtC(now - L.t0)); else setTime('?', true);
      line = `<b>${esc(L.step || '')}</b>${L.tmode === 'hand' ? ' · con su cubo' : ''}`;
    } else if ((L.phase === 'answered' || L.phase === 'result') && L.res) {
      const ok = !!L.res.ok;
      setPill(ok ? 'learnok' : 'learnko', ok ? (L.phase === 'result' ? 'Resuelto' : 'Acertado') : 'Fallado');
      setTime(L.res.t != null ? fmtC(L.res.t) : ok ? '✓' : '✗', L.res.t == null);
      line = ok
        ? `<span class=ok>✓</span> <b>${esc(L.res.name)}</b>${L.res.r != null ? ` · reconocer ${fmtC(L.res.r)} + hacer ${fmtC(L.res.t - L.res.r)}` : ''}`
        : `<span class=ko>✗</span> Era <b>${esc(L.res.name)}</b>${L.res.guess ? ` (dijo ${esc(L.res.guess)})` : ''}`;
    } else {
      setPill('learn', L.view === 'casos' ? 'Repasando casos' : 'Entrenando');
      setTime('—', true);
    }
    const box = $('liveLine');
    const html = line ? `<div class=learnline>${line}</div>` : '';
    box.hidden = !html;
    if (box.dataset.h !== html) { box.dataset.h = html; box.innerHTML = html; }
    const S2 = L.session;
    const clk = document.getElementById('lsClock');
    if (S2 && clk) {
      const ms = S2.active + Math.min(Math.max(0, now - S2.lastAt), 120000);
      text(clk, `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, '0')}`);
    }
    $('live').classList.toggle('on', DEMO || now - liveAt < 12000);
  }

  // memo: { e: 'OK TX HF', c: 'MV WF' } or null
  function setMemo(memo) {
    const box = $('memoLine');
    const m = SHOW_MEMO && memo && (memo.e || memo.c) ? memo : null;
    const key = m ? `${m.e}|${m.c}` : '';
    stage.toggleAttribute('data-memo', !!m);
    box.hidden = !m;
    if (box.dataset.k === key) return;
    box.dataset.k = key;
    box.textContent = '';
    if (!m) return;
    const row = (label, letters, parity) => {
      const r = document.createElement('div');
      r.className = 'mrow';
      const l = document.createElement('span');
      l.className = 'ml';
      l.textContent = label;
      const c = document.createElement('code');
      c.textContent = letters || '—';
      r.append(l, c);
      if (parity) {
        const p = document.createElement('span');
        p.className = 'par';
        p.textContent = '+ R-perm';
        r.appendChild(p);
      }
      box.appendChild(r);
    };

        const [phase, ms] = loop[i];
        receive(at(phase), true);
        if (phase === 'exec') {
          let k = 0;
          tick = setInterval(() => { k = Math.min(MOVES.length, k + 1); S.smart.live = liveAt(k); }, Math.floor(ms / MOVES.length));
        }
        setTimeout(() => { i = (i + 1) % loop.length; show(); }, ms);
      };
      show();
    }
  }
})();
</script>
